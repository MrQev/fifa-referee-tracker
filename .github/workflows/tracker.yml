name: FIFA Tweet Tracker

on:
  workflow_dispatch: # Spouští se výhradně přes API (externí cron-joby) nebo ručně tlačítkem
    inputs:
      source:
        description: "Který zdroj zpracovat: 'fifa', 'rfef', 'fifa,rfef', nebo prázdné = všechny"
        required: false
        default: ""

env:
  # Odstraní varování ohledně Node.js 20 a vynutí bezpečný chod na Node 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repozitáře
      uses: actions/checkout@v4

    - name: Nastavení Pythonu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Zde byl opraven překlep z 'python-python'

    - name: Instalace závislostí
      run: |
        pip install playwright requests
        playwright install chromium

    - name: Spuštění sledovače
      env:
        X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        SOURCE: ${{ github.event.inputs.source }}
      run: python tracker.py

    - name: Nahrání diagnostiky při chybě
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-screenshots
        path: debug/
        if-no-files-found: ignore

    - name: Uložení stavu (Commit změny ID tweetů)
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add last_tweet_id_*.txt
        git commit -m "Aktualizace posledních tweet ID [skip ci]" || exit 0
        git push
